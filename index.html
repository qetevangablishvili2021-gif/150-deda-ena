და ბულინგის მიმართ შეურიგებელი, კეთილგანწყობილი დამოკიდებულება.',\n            ],\n            outcomes: [\n                'ასახელებს ნინოს გრძნობებს სკოლაში დაბრუნებამდე და დაბრუნების შემდეგ.',\n                'აფასებს კატოსა და თანაკლასელების საქციელს.',\n                'მოჰყავს თანაგრძნობის მაგალითები საკლასო ცხოვრებიდან.',\n            ],\n            comprehensionQuestions: [\n                { level: 'გახსენება', question: 'როგორ იქცეოდა ნინო სკოლაში მოთხრობის დასაწყისში?' },\n                { level: 'გახსენება', question: 'რატომ ეშინოდა ნინოს სკოლაში დაბრუნება?' },\n                { level: 'ანალიზი', question: 'რატომ გააკვირვა ნინო კატოსა და თანაკლასელების დახვედრამ?' },\n                { level: 'ღირებულებითი მსჯელობა', question: 'რატომ არის პატიება სამაგიეროს გადახდაზე ძლიერი არჩევანი?' },\n            ],\n            discussionPrompts: [\n                'რა შეიცვალა ნინოს გულში, როცა „შვების ცრემლი წასკდა“?',\n                'როგორ დავეხმაროთ კლასში იმ მოსწავლეს, ვისაც რაღაცის ეშინია ან თავს მარტო გრძნობს?',\n            ],\n            groupActivity: '„კეთილი სიტყვების წრე“: მოსწავლეები წრეში სხდებიან და თითოეული ამბობს ერთ გულწრფელ გამამხნევებელ ფრაზას, რომელსაც კლასში დაბრუნებულ ნინოს ეტყოდა.',\n            individualTask: 'დაწერე მოკლე წერილი ნინოს ან კატოს სახელით: რას გრძნობდნენ ისინი იმ დღეს სკოლის კართან?',\n            worksheetTasks: [\n                '1. შეადარე ნინოს ქცევა მოთხრობის დასაწყისსა და დასასრულში.',\n                '2. განმარტე გამოთქმები: „აბუჩად აგდება“, „ჯავრის ამოყრა“, „შვების ცრემლი“.',\n                '3. დაწერე სამი თვისება, რაც ნამდვილ მეგობარს უნდა ჰქონდეს.',\n            ],\n            rubric: [\n                {\n                    criterion: 'ემპათია და პერსონაჟის გაგება',\n                    emerging: 'ამოიცნობს ნინოს შიშს.',\n                    developing: 'ხსნის კატოს კეთილგანწყობის მიზეზს.',\n                    exemplary: 'ღრმად აანალიზებს ორივე პერსონაჟის შინაგან ცვლილებას.',\n                },\n                {\n                    criterion: 'ღირებულებითი პოზიცია',\n                    emerging: 'აღნიშნავს, რომ დაცინვა ცუდია.',\n                    developing: 'მსჯელობს თანაგრძნობისა და პატიების მნიშვნელობაზე.',\n                    exemplary: 'აყალიბებს ჯანსაღ საკლასო ქცევის წესებს და იცავს თანასწორობას.',\n                },\n            ],\n            selfAssessmentStatements: [\n                'შემიძლია ამოვხსნა პერსონაჟის გრძნობები ტექსტის მიხედვით.',\n                'ვიცი, რატომ არის თანაგრძნობა და პატიება ძლიერი ადამიანის თვისება.',\n                'ვცდილობ, კლასში ყველას კეთილგანწყობით მოვეპყრო.',\n            ],\n        },\n    },\n    {\n        id: 'erekle',\n        missionNumber: 3,\n        title: 'ერეკლე მეფე და ინგილო ქალი',\n        subtitle: 'სამშობლოს სიყვარულის, სიმამაცისა და ერთგულების ამბავი',\n        recommendedGrade: 'III კლასი (რეკომენდებული)',\n        gradeTag: 'III',\n        locationName: 'საინგილოს ვენახები',\n        valueTitle: 'სამშობლოს სიყვარული',\n        valueSymbolName: 'სამშობლოს ვაზის გვირგვინი',\n        accentColor: '#7F1D1D',\n        shortDescription: 'უშიშარი ინგილო გოგონას გაბედული საქციელი საინგილოში მეფე ერეკლესთან სამუდამო მეგობრობასა და სამშობლოსთვის თავგანწირვის დიდ ისტორიად იქცევა.',\n        paragraphs: [\n            'ერეკლე მეფეს ომი ჰქონდა ჭარის ლეკებთან და ძლიერ დაამარცხა. გამარჯვების შემდეგ თავისი ჯარით უკან გამობრუნდა მეფე, ორმოცდაათი წლის ვაჟკაცი, მშვენიერს ბედაურზე იჯდა და წინ მოუძღოდა ჯარსა. ჯარი, გრძლად და ლამაზად დამწკრივებული, ფეხდაფეხ მისდევდა მეფესა. გზა საინგილოზე მიდიოდა. ერეკლე შემოვიდა ერთს განიერს ორღობეში, რომლის აქეთ-იქით ჩამწკრივებული იყო დიდრონი ვენახები და ბაღები, სავსე დამკრახული და დაბრაწული ხილითა. უცებ მეფეს თავზე ვიღაცამ გადმოაყარა მთელი ბღუჯა ქლიავი. გაოცებულმა მეფემ თავისი ბედაური შეაყენა. გაჩერდა ჯარიცა.',\n            'მიიხედ-მოიხედეს და იქვე ვენახის ღობესთან დაინახეს ვეებერთელა ქლიავის ხეზე თორმეტიოდე წლის ინგილო გოგონა, რომელსაც ქლიავი ესროლა მეფისთვის. მხლებელნი მეფისა წამსვე ჩამოიჭრნენ ცხენებიდან, აცვივდნენ ღობეზე და შეჰყვირეს პატარა ქალსა: „შე ბრიყვო, შე საძაგელო, ეს რა ჰქენი? მეფე ერეკლეს თავზე ქლიავის გადმოყრა როგორ გაბედე? ჩამო ეხლავ ხიდან და ბოდიში მოითხოვე მეფის წინაშე, თორემ შავი დღე დაგადგება“.',\n            '— რაო? მეფე ერეკლეო? — განცვიფრებით ჩამოსძახა ზევიდან გოგონამ. — რას ამბობთ? ეგ რომ ჩვენი სახელოვანი მეფე ერეკლე იყოს, განა სპარსულს ქუდს თავზე დაიხურავდა? არა, ეგ ტყუილია. მე ქლიავი თავზე გადმოვაყარე სპარსელს, ჩვენს მოსისხლე მტერსა და არა მეფე ერეკლეს, რომელიც ყველა ქართველს ღმერთივით გვიყვარს და თქვენ სულ ტყუილად მემუქრებით. არც ძირს ჩამოვალ და არც ბოდიშს მოვიხდი. — და უფრო მაღლა წავიდა ხეზე.',\n            'ეს პასუხი გაიგონა მეფე ერეკლემ, გულიანად გადაიხარხარა, მოიხადა სპარსული ქუდი, რომლის ტარებას დაეჩვია ყმაწვილობაში, სპარსეთში ყოფნის დროსა, დაანახვა თავისი მშვენივრად მოყვანილი ქართული თავი და შესძახა პატარა ქალსა: „ყოჩაღ, ქალო! სრულიად მართალი ხარ. სპარსული ქუდი სწორედ რომ არ უნდა მეხუროს მე. ქართველი მეფე გარეგნობითაც, ტანისამოსითაც ქართველი უნდა იყოს. კარგი, ჩინებული დარიგება მომეცი შენ მაგ ქლიავის სროლითა. ბარაქალა შენს ქართველ ქალობასა!“ ამასთან ერეკლემ იკრა ჯიბეზე ხელი, ამოიღო მთელი ბღუჯა თეთრი ფული, მისცა თავის მხლებლებს და უბრძანა: „საჩუქრად მიეცით ეს მაგ სამაგალოთო ქართველ გოგოცუნასო“.',\n            'გოგო ახლა კი მიხვდა თავის შეცდომას და შეწუხდა ძლიერ, საჩუქარი შორს დაიჭირა, ცივს უარზე დადგა, მაგრამ მხლებელმა უთხრა მოსარბილებლად: „განა მეორედაც გინდა აწყენინო მეფესა? მეფის წყალობაზე უარის თქმა ვის გაუგონია? თუ გსურს, შენი შეცდომა გაასწორო და ერეკლე მეფეს აამო, ეს ფული მიიღე საჩუქრადა“. მაშინ კი გოგო დაეთანხმა, ზევიდან ქვემო ტოტზე ჩამოვიდა, მოსწვდა ძირსა, გამოართვა ფული და ჯიბეში ჩაიჩხრიალა; მერმე შურდულივით ავარდა ქლიავის კენწეროზე, კარგად გამოჩნდა, გასწორდა ტოტზე, მეფეს დაბლა დაუკრა თავი და წკრიალა ხმით გადმოსძახა: „მეფე ერეკლეს გაუმარჯოს!“ „ქართველ ქალსაც გაუმარჯოს!“ — შესძახა მამობრივი ხმით მეფე ერეკლემ, დასძრა თავისი ბედაური და ჯერ კიდევ თავმოხდილი გაუძღვა ჯარსა.',\n            'ჯარი, ამაყი თავისი მამაცი მეფით და თავისი ვაჟკაცობით, უკან მისდევდა მწყობრად და თანაც აგუგუნებდა მშვენიერს ქართულს სიმღერასა. ქართველი ქალი კი იდგა ამართული ქლიავის კენწეროზე, თვალს არ აშორებდა მიმავალს მეფესა და მის ჯარსა და, შეწყდებოდა თუ არა სიმღერა, ჰაერში გაისმოდა მისი ზარივით ხმა: „მეფე ერეკლეს გაუმარჯოს!“ „ქართველ ჯარს გაუმარჯოს!“ ამ სახით იდგა ქართველი ქალი დიდხანს და გრძნობდა იმისთანა სიხარულს, იმისთანა ნეტარებას, რომელიც წინათ სიზმრადაც არ მოსჩვენებია. ქალს უზომოდ ახარებდა ნახვა სანატრელის მეფისა, მასთან საუბარი, მისი მამობრივი ქება, მისი მეფური საჩუქარი. ქალი, სიხარულით დამთვრალი, ჩამოვიდა ხიდან მხოლოდ მაშინ, როდესაც შორეულმა ნისლმა დაჰფარა მეფეცა და მისი ჯარიცა. მაგრამ ამ ადგილიდან ქალს წასვლა აღარ უნდოდა. ის სიყვარულით შესცქეროდა ხან იმ ადგილს, სადაც მეფე ერეკლე ედგა და ელაპარაკებოდა და ხან ქლიავის ხესა, რომელთანაც იმ დღიდან შეერთდა, შეხორცდა მის გონებაში ბედნიერი წამი, უტკბილესი შემთხვევა. ერთი საათის წინათ უბრალო ხეხილი ახლა ამ პატარა ქალის თვალში გადაიქცა გულითად მეგობრად, ძვირფას მოკეთედ, თითქმის კეთილ სულიერად გადაიქცა სამუდამოდ, საუკუნოდ. ბოლოს გოგოცუნა გამოფხიზლდა ჭარბი სიხარულისგან, მოაგონდა თავისი დედ-მამა და მოჰკურცხლა შინისაკენ, რათა ეხარებინა მათთვის თავისი საარაკო ბედნიერება.',\n            'გავიდა რამდენიმე წელიწადი. ერთს ინგილო გლეხს თავის დარბაზში ქორწილი ჰქონდა გაჩაღებული. დედოფლად იყო ჩვენი ნაცნობი ინგილო ქალი, ახლად შეღერებული და ისეთი ეშხიანი, რომ კაცი თვალს ვერ მოაშორებდა. მის ჭკვიანსა და მიმზიდველ სახეზე თამაშობდა, ბრწყინავდა სხივი პირველის ქალწულებრივის სიყვარულისა. ეს სიყვარული აენთო უმანკო ქალის გულში ერთს საუკეთესო ინგილო ვაჟკაცსა, რომელიც მას გვერდს უმშვენებდა. ამასაც პირისახეზე ცხადად ჰქონდა აღბეჭდილი ნეტარება პირველის უმანკო სიყვარულისა. პირველის წმინდა სიყვარულს უმანკო ქალისას პასუხს უგებდა, ბანს აძლევდა პირველი და წმინდა სიყვარული უმანკო ვაჟისა. „ფერი ფერსა მადლი ღმერთსა“, ფიქრობდა და ამბობდა ყველა, ვინც კი ამ მეფე-დედოფალს ერთად ჰხედავდა.',\n            'დაიწყო თუ არა საქორწილო ლხინი, თამადამ ბრძანების კილოთი წარმოსთქვა ხმამაღლა: „სმენა იყოს და გაგონება! ეს ღმერთმა აცოცხლოს და ადღეგრძელოს ჩვენი გმირი მეფე ერეკლე, გამარჯვება ნუ მოაკლოს ლეკებზე, სპარსელებზე, ოსმალებზე, სამხრეთსა და ჩრდილოეთზე“. „ადღეგრძელოს, ადღეგრძელოს!“ — შესძახეს ისეთი აღტაცებით სტუმრებმა, რომ კაცს შეეშინდებოდა, ჭერი არ ჩამოინგრესო. სწორედ ამ წუთს უცებ გაიღო დარბაზის კარები, შევიდა ერთი უცხო ვაჟკაცი, მშვენიერს ტანისამოსში გამოწყობილი, და სალამი მისცა: „აგაშენოთ ღმერთმა და აბედნიეროს მეფე-დედოფალი!“ მერმე სთქვა: „რა ჩინებულს დროს მოვედი და მე გამომგზავნა მეფე ერეკლემ და მიბრძანა: „ეს საჩუქარი მიართვი იმ ინგილო ქალსა, რომელმაც რამდენიმე წლის წინათ მთელი მუჭა ქლიავი უთავაზა ჩემს სპარსულს ქუდსაო“, და გადასცა დედოფალს ვეებერთელა ქისა, სავსე ბაჯაღლო ოქროებითა. მზითევიც გამომატანა და აი კიდეც მოაქვთო, და ამ დროს კარზე მოადგათ რამდენიმე ურემი, დატვირთული მშვენიერი მზითვის ნივთეულობითა.',\n            'დატრიალდა ისეთი სიხარული, ასტყდა ისეთი ქება და დიდება ერეკლესი, მისი კაცთმოყვარეობისა, რომ არც ენით ითქმის და არც კალმით აიწერება სავსებით. არ დარჩა არც ერთი ლექსი იმ მრავალ სადიდებელ ლექსთაგანი, რომელნიც ერეკლეზე იყვნენ გამოთქმულნი, რომ არ ემღერნათ სტუმრებმა უსაზღვრო აღტაცებით. მღეროდნენ კაცნიც, ქალნიც, დიდნიც და პატარანიცა და ადიდებდნენ მეფე ერეკლესა. მეტადრე დედოფალი სამოთხის ნეტარებასა გრძნობდა. ისე მზითევი არ ახარებდა, როგორც ყურადღება სათაყვანო მეფისა. გავარდა ფიცხლავ ეს ხმა მთელს საინგილოში და ყველა ინგილო ქალი თუ კაცი, მზითევის გაგზავნას მეფისაგან საკუთარ, პირად ჯილდოდ სთვლიდა, მთელის საინგილოს დასაჩუქრებლად მიაჩნდა. და ეს განაპირა კუთხე საქართველოსი მთლად აივსო მხურვალე მადლობითა და უზომო ერთგულებით მეფისადმი.',\n            'ამის შემდეგ განვლო კიდევ ოცდახუთმა წელმა. კრწანისის ველზე თბილისის პირში საშინელი ომი იყო. ხუთი ათასი ქართველი ებრძოდა სამშობლოს დასაცველად სამოცდაათიათას სპარსელსა. ოთხმოცი წლის ერეკლე მეფე, ჯერ კიდევ მხნე და გულადი, ლომივით იბრძოდა და თავს სრულიად არ ზოგავდა. მისი სიცოცხლე ყოველ წამს საფრთხეში იყო. ხან მის ახლო, ხან მის გვერდით, ხან მის წინ იბრძოდნენ, სხვათა შორის ორნი რჩეულნი ვაჟკაცნი, რომელნიც თავისი საოცარი სიმამაცით, თავისი თავგანწირულობით მეფისათვის, ყველას ყურადღებას იპყრობდნენ, ყველას აკვირვებდნენ, არა ერთხელ აქციეს მათ უკან მტერი, მეფეზე მოსული, არაერთხელ მიუშვირეს მათ საკუთარი მკერდი მტრის ტყვიასა და ხმალს, მეფისათვის დამიზნებულს, არა ერთს სპარსელს დაუბნელეს მზე. მაგრამ თავისი სიცოცხლე კი შესწირეს მეფესა და საქართველოს. ეს ორივენი დაიხოცნენ კრწანისის ველზე გმირულის სიკვდილით მეფე ერეკლეს თვალის წინ. ვინ იყვნენ ეს ნორჩნი ვაჟკაცნი? იგინი იყვნენ უფროსი ვაჟიშვილები ჩვენი ნაცნობი ინგილო ქალისა და ნათლულნი თვით მეფე ერეკლესი.',\n            'დედას მალე მოუვიდა საინგილოში ამბავი: შენმა შვილებმა დიდი ვაჟკაცობა გამოიჩინეს, არა ერთხელ გადაარჩინეს სიკვდილს თავისი ნათლია მეფე, მრავალს სპარსელს დაუბნელეს მზე და თავი შესწირეს მეფესა და საქართველოსაო. „ვმადლობ, მხურვალედ ვმადლობ უფალსა, რომ მან აღირსა ჩემს შვილებს გმირული სიკვდილი, სიკვდილი სახელოვანი მამულიშვილებისა“, — წარმოსთქვა დედამ იმისთანა ხმით, რომელშიაც დიდ ნუგეშთან უღრმესი და უმწარესი დედობრივი სიმწუხარე ცხადად ისმოდა. „ტყუილად კი არ მძულდნენ პატარაობიდანვე სპარსელები ისე ძლიერ, რომ მზად ვიყავი, ყოველს მათს დანახვაზე ზედ შევკვდომოდი. გული თითქოს მაშინვე მეუბნებოდა, რომ ეს მტარვალები შენცა და შენს საქართველოსაც დიდს უბედურებას მიაყენებენო და აჰა წინათგრძნობა გულისა მთლად ამიცხადდა“. „მაგრამ, ნუ გაუხარდებათ მტრებსა“, — განაგრძო სამაგალითო დედამ: — „ღვთის წყალობით, მე კიდევ მყავს ოთხი ვაჟი და ორი ქალი. მე მათ დავზრდი უფრო უკეთესს, უფრო გულმხურვალე მამულიშვილებად და ისინი სხვა ქართველი დედების აღზრდილ მამულიშვილებთან ერთად გადაუხდიან მტერს სამაგიეროს და ჩვენს საქართველოს დააყენებენ ბედნიერს გზაზე“.',\n        ],\n        glossary: [\n            { word: 'ბედაური', meaning: 'საუკეთესო ჯიშის, სწრაფი და ლამაზი ცხენი.', context: '„მშვენიერს ბედაურზე იჯდა“' },\n            { word: 'ორღობე', meaning: 'სოფლის ვიწრო გზა ვენახებსა და ბაღებს შორის, ღობეებით შემოსაზღვრული.', context: '„შემოვიდა ერთს განიერს ორღობეში“' },\n            { word: 'დამკრახული და დაბრაწული', meaning: 'მზისგან შემწიფებული, დატკბობილი და შეფერილი ხილი.' ადასავალი: ქლიავის ხის ეპიზოდი, საქორწილო მზითვის ურმების გაცილება საინგილოში და კრწანისის ფარით დაცვა.',\n        teacher: {\n            objectives: [\n                'მოსწავლეებმა გაიაზრონ მეფესა და ხალხს შორის ურთიერთპატივისცემის მნიშვნელობა.',\n                'გაარჩიონ ისტორიული ფაქტები (ერეკლე II, კრწანისი 1795) და მხატვრული გამონაგონი/ფოლკლორული გადმოცემა.',\n                'იმსჯელონ პატრიოტიზმის, სიმამაცისა და სიტყვის ერთგულების შესახებ.',\n            ],\n            outcomes: [\n                'ასახელებს მოთხრობის სამ დროით ეტაპს (შეხვედრა საინგილოში, ქორწილი, კრწანისი 25 წლის შემდეგ).',\n                'ხსნის, რატომ მოიწონა მეფემ გოგონას გაბედული შენიშვნა.',\n                'გამოთქვამს საკუთარ აზრს მამულიშვილობის თანამედროვე მნიშვნელობაზე.',\n            ],\n            comprehensionQuestions: [\n                { level: 'გახსენება', question: 'რატომ გადააყარა ინგილო გოგონამ მეფეს ქლიავი?' },\n                { level: 'ანალიზი', question: 'როგორ დაამტკიცა მეფე ერეკლემ თავისი სიდიადე გოგონას პასუხის შემდეგ?' },\n                { level: 'ანალიზი', question: 'რა კავშირია საქორწილო მზითევსა და 25 წლის შემდეგ კრწანისის ბრძოლას შორის?' },\n                { level: 'ღირებულებითი მსჯელობა', question: 'როგორ გესმით დედის სიტყვები მოთხრობის ბოლოს?' },\n            ],\n            discussionPrompts: [\n                'რატომ არის მნიშვნელოვანი, რომ ლიდერმა უბრალო ადამიანის სამართლიანი შენიშვნა მოისმინოს?',\n                'რას ნიშნავს სამშობლოს სიყვარული მშვიდობიან დროს III–IV კლასის მოსწავლისთვის?',\n            ],\n            groupActivity: 'ქრონოლოგიური ლენტი: ჯგუფები აწყობენ 3 პლაკატს დროის მიხედვით — (1) შეხვედრა ორღობეში, (2) ქორწილი საინგილოში, (3) კრწანისის გმირები — და წერენ სათაურებს.',\n            individualTask: 'შეადარე: რა არის ამ მოთხრობაში რეალური ისტორიული ფაქტი და რა — ხალხური გადმოცემის მხატვრული სახე?',\n            worksheetTasks: [\n                '1. განმარტე სიტყვები: „ორღობე“, „ბედაური“, „ბარაქალა“, „მზითევი“.',\n                '2. აღწერე მეფე ერეკლეს ხასიათი ტექსტიდან მოყვანილი ორი მაგალითით.',\n                '3. დახაზე მოთხრობის სამი მთავარი ეპიზოდის დროის ხაზი.',\n            ],\n            rubric: [\n                {\n                    criterion: 'სიუჟეტური კავშირის გაგება',\n                    emerging: 'აღწერს ქლიავის სროლის სცენას.',\n                    developing: 'აკავშირებს ქორწილსა და საჩუქარს პირველ შეხვედრასთან.',\n                    exemplary: 'ხედავს მთლიან თაობათა კავშირს — ერთგულებას საინგილოდან კრწანისამდე.',\n                },\n                {\n                    criterion: 'ისტორიული და მხატვრული გარჩევა',\n                    emerging: 'იცის, რომ ერეკლე მეფე ისტორიული პირია.',\n                    developing: 'ასახელებს კრწანისის ბრძოლას.',\n                    exemplary: 'მკაფიოდ განასხვავებს ისტორიულ კონტექსტს და ავტორისეულ მხატვრულ სიუჟეტს.',\n                },\n            ],\n            selfAssessmentStatements: [\n                'წავიკითხე სრული ტექსტი და გავიგე სამივე ეპიზოდის კავშირი.',\n                'შემიძლია ავხსნა, რატომ მოიხადა ერეკლემ სპარსული ქუდი.',\n                'ვასახელებ ისტორიულ ფაქტებსა და მხატვრულ ელემენტებს.',\n            ],\n        },\n    },\n    {\n        id: 'ants',\n        missionNumber: 4,\n        title: 'ჭიანჭველები',\n        subtitle: 'ბუნების დაკვირვება, გონიერება, ერთობა და თავდადება',\n        recommendedGrade: 'IV–V კლასები (რეკომენდებული)',\n        gradeTag: 'IV',\n        locationName: 'ჭიანჭველების კოლონია',\n        valueTitle: 'ერთობა, თანამშრომლობა და თავდადება',\n        valueSymbolName: 'ერთობის ხიდი',\n        accentColor: '#3F6212',\n        shortDescription: 'გონიერი ჭიანჭველები ორ რთულ დაბრკოლებას — თამბაქოს სალტესა და წყლის თხრილს — მხოლოდ საერთო თათბირითა და ერთმანეთისთვის თავდადებით სძლევენ.',\n        paragraphs: [\n            'თუ მინდორში და ტყეში გივლიათ, არაერთხელ წაადგებოდით ჭიანჭველების ბუდეს. შორიდან ეს ამაღლებული ბუდე პატარა ბორცვად მოგეჩვენებათ, მაგრამ როცა ახლოს მიხვალთ, ნახავთ, რომ იგი არის პაწაწინა ნაფოტების, ფოთლების, ჩალის, კენჭების, ფისის ნარჩენების და სხვა მრავალი რამისგან აგებული შენობა. ბუდის ზემოთ დაფუსფუსებენ ამ ბუდის ამშენებლები.',\n            'ერთ ბაღში ბევრი ხილი იყო დარგული. სულ სავსე იყო ტმით, კაკლით, მსხლით. ამ ბაღში ცხოვრობდა მებაღე: ხეხილებს გამხმარ ტოტებს უსხლავდა, ყვავილებს წყალს უსხამდა და ბაღის პატარა სასეირნო ბილიკებზე წმინდა ქვიშას ჰფენდა.',\n            'ბაღის ახლომახლო თავიანთ ბუდეში ცხოვრობდა ათასობით ჭიანჭველა. მათ შეიტყვეს, რომ ბაღში ბევრი ამათი საყვარელი ხილი ხარობდა. ჭიანჭველები დიდი გროვით გაემგზავრნენ ბაღისაკენ. აცოცდნენ ერთ ხეზე და მის ხილს ჭამა დაუწყეს.',\n            'ხე ჭიანჭველებით ისე შეიფინა, რომ შავი ფერი დაედო. მებაღე რომ ამ ხესთან გასასხლავად მივიდა, ზედ უთვალავი ჭიანჭველა დაინახა და ხე ძალიან დაენანა. ჭიანჭველებს ხიდან ჩამორეკა დაუწყო; მაგრამ ისინი მიესივნენ და კბენა დაუწყეს: მებაღემ თავი დაანება და უკან გამობრუნდა.',\n            'ყოველ ცისმარე დღეს ჭიანჭველები გაემგზავრებოდნენ ხოლმე ბაღისაკენ და ყოველთვის იმავე ხეზე ადიოდნენ. — რა უნდა ვუყო ამ ჭიანჭველებს? — ჰკითხავდა ყოველ თავის ნაცნობს მებაღე, მაგრამ გამოსადეგი რჩევის მიცემა ვერავინ შეძლო. შემდეგ ერთმა ბებერმა კაცმა უთხრა: „თამბაქოს წვენი წაუსვი ხეს და ჭიანჭველები სრულებითაც ვეღარ მიეკარებიან“.',\n            'მეორე დღეს, როცა ჭიანჭველები ხეზე იყვნენ, მებაღემ აიღო თამბაქოს ფოთლები და მათი წვენით ხის ღერო ორი თითის დადებაზე გარშემო დაასველა. „ახლა კი ჭიანჭველები სამუდამოდ ხეზე დარჩებიან და აქ დაიხოცებიან“, — იფიქრა მებაღემ.',\n            'როდესაც ჭიანჭველები დანაყრდნენ და ძირს ჩამოცოცდნენ, ნახეს, რომ ყველანი დატყვევებულიყვნენ და ვეღარ დაბრუნდებოდნენ თავიანთ სადგომში. ხიდან ჩამოხტომა ჭიანჭველებს არ შეეძლოთ; მათ არც ფრენა იციან, რადგანაც ფრთები არა აქვთ. რა უნდა ექნათ?',\n            'მათ ხის კენწეროზე მოიყარეს თავი და სჯა-ბაასი დაიწყეს, თუ როგორ უნდა ეშველათ თავისათვის. გამოცდილმა ჭიანჭველებმა ჭიანჭველურ ენაზე თქვეს: — მოისმინეთ, მეგობრებო! ვინც ჩვენში უფრო გულადნი არიან, ისინი გავიდნენ გაყვითლებულ ფოთლებზე: ფოთლები ძირს ჩაცვივდება და მათზე მჯდომარენი თან ჩაჰყვებიან. მერე ისინი შეეცდებიან, ქვემოდან მიწის ხიდი გაგვიკეთონ იმ თამბაქოს წვენის სალტეზე.',\n            'იმ წამსვე უფრო ღონიერი ჭიანჭველები დასხდნენ გაყვითლებულ ფოთლებზე და მათთან ერთად ჩაცვივდნენ მიწაზე; იმათ მაშინვე მიჰყვეს მუშაობას ხელი; თამბაქოს სალტესთან მოზიდეს სველი მიწის კარგა მოზრდილი ნამცეცები, ზედ გარდიგარდმო კარგად მიაგლისეს და პატარა ხიდი გამართეს.',\n            'გაიმართა თუ არა ხიდი, ხეზე მომწყვდეული ჭიანჭველები სიხარულით დაეშვნენ ქვევით, მშვიდობით გამოიარეს გაკეთებული ხიდი და ძირს ჩამოვიდნენ. შემდგომ ამ ხიდზე ასვლა და ჩამოსვლა ისე გამართეს, თითქოს თამბაქოს წვენის სალტე სულაც არა ყოფილიყოს. მებაღე ყველაფერს ხედავდა, რასაც კი ჭიანჭველები სჩადიოდნენ, მაგრამ არას უშლიდა: პირიქით, დიდი სიამოვნებით და გაკვირვებით ადევნებდა თვალს, თუ როგორ გონივრულად აკეთებდნენ თავიანთ საქმეებს ჭიანჭველები.',\n            'მაგრამ მას ხეც ძალიან ენანებოდა. მებაღე დაღონდა და სულ იმას ფიქრობდა, თუ როგორ მოეშორებინა ჭიანჭველები თავიდან. ერთხელ, როცა ჭიანჭველები ხეზე ისხდნენ, მებაღემ ხის გარშემო პატარა თხრილი გააკეთა, წყლით აავსო და გაიფიქრა, ახლა კი ჭიანჭველები შინ დაბრუნებას ვეღარ ეღირსებიან, გზა ხომ შეკრულია, გარშემო სულ წყალი დგასო.',\n            'საღამოთი ჭიანჭველებმა ძირს ჩამოსვლა დაიწყეს, მიადგნენ პატარა თხრილს და გაჩერდნენ. გარშემო წყალი დახვდათ. — ერიჰაა, უბედურება გვეწია, ვეღარ დავბრუნდებით ჩვენს სახლში! — თქვეს ჭიანჭველებმა და ხის გარშემო შეგროვდნენ. განსაცდელში ჩავარდნილებმა სჯა-ბაასი დაიწყეს, თუ როგორ დაეღწიათ თავი ხიფათისაგან.',\n            'სამი გონიერი ჭიანჭველა მიუახლოვდა ყრილობას და უთხრა: — ჩვენი საქმე ჯერ სრულებით არ არის წამხდარი. ნუ გეშინიათ, ძმებო, გულმაგრად იყავით. ზოგი ჩვენგანი უნდა შევიდეს წყალში და დაიხრჩოს; მაგრამ ამ გმირობის ფასად, დანარჩენი ყველა ჭიანჭველა ამ დამხრჩვლებზე, როგორც კარგ ხიდზე, ისე გაივლის. ყველაზე უწინ ჩვენ სამნი მოგცემთ მაგალითს!',\n            'როდესაც ამათ ყველა სხვა ჭიანჭველა დაეთანხმა, ეს სამი ჭიანჭველა პირდაპირ შევარდა წყალში, ამათ მიჰყვა უკან ბევრი, ძალიან ბევრი ჭიანჭველა; ერთი ერთმანეთზე შედგნენ, გამწკრივდნენ გუბის მეორე ნაპირამდე და ამნაირად გამართეს ჩინებული ხიდი, რომელზედაც ადვილად გავიდნენ დანარჩენი ჭიანჭველები და მივიდნენ თავიანთ ბინაზე.',\n            'როდესაც მებაღემ დაინახა, რომ ჭიანჭველებს ისე უყვართ ერთმანეთი, რომ საერთო გაჭირვების დროს სიცოცხლეს არ ზოგავენ ერთმანეთისათვის, მაშინ მათ შევიწროებას თავი გაანება და მისცა ნება, ეჭამათ იმის ბაღში იმდენი ხილი, რამდენიც უნდოდათ.',\n        ],\n        glossary: [\n            { word: 'ტმა (თუთა/ხილი)', meaning: 'ძველ ტექსტში ხეხილის სახეობა (ხშირად თუთა ან ტყემალი).', context: '„სულ სავსე იყო ტმით, კაკლით, მსხლით.“' },\n            { word: 'ყოველ ცისმარე დღეს', meaning: 'ყოველ დილით, ყოველდღე გათენებისას.', context: '„ყოველ ცისმარე დღეს ჭიანჭველები გაემგზავრებოდნენ ხოლმე ბაღისაკენ...“' },\n            { word: 'სალტე', meaning: 'წრიული რკალი, ზოლი ხის ღეროს გარშემო.', context: '„თამბაქოს წვენის სალტეზე“' },\n            { word: 'სჯა-ბაასი', meaning: 'მსჯელობა, თათბირი, გამოსავლის ერთობლივი ძიება.', context: '„და სჯა-ბაასი დაიწყეს, თუ როგორ უნდა ეშველათ თავისათვის.“' },\n            { word: 'გარდიგარდმო', meaning: 'გადაჯვარედინებულად, სიგრძე-სიგანეზე, მთლიანად დაფარვით.', context: '„ზედ გარდიგარდმო კარგად მიაგლისეს“' },\n            { word: 'მიაგლისეს', meaning: 'მჭიდროდ მიაკრეს, მილესეს სველი მიწა.', context: 'ხიდის მშენებლობა ხის ღეროზე.' },\n            { word: 'ჩინებული', meaning: 'შესანიშნავი, საუკეთესო, კარგად გამართული.', context: '„გამართეს ჩინებული ხიდი“' },\n        ],\n        scenes: [\n            { id: 'ant-1', order: 1, title: 'ჭიანჭველების ბუდე', episodeText: 'ნაფოტების, ფოთლების, ჩალისა და კენჭებისგან აგებულ ბორცვზე ფუსფუსებენ მისი ამშენებლები.', visualType: 'ant_nest', caption: 'ტყის პირას აგებული ჭიანჭველების საოცარი ბუდე.', durationMs: 4200 },\n            { id: 'ant-2', order: 2, title: 'ხილით სავსე ბაღი', episodeText: 'ბაღში ბევრი ხილი იყო დარგული; მებაღე ხეხილს უვლიდა და ბილიკებზე ქვიშას ჰფენდა.', visualType: 'ant_garden', caption: 'მზით განათებული ხეხილის ბაღი და მზრუნველი მებაღე.', durationMs: 4200 },\n            { id: 'ant-3', order: 3, title: 'ჭიანჭველების ბაღისკენ გადაადგილება', episodeText: 'ჭიანჭველები დიდი გროვით გაემგზავრნენ ბაღისაკენ და აცოცდნენ ხეზე.', visualType: 'ant_march', caption: 'მწკრივად მიმავალი ჭიანჭველების გუნდი ბაღის ხისკენ.', durationMs: 4200 },\n            { id: 'ant-4', order: 4, title: 'მებაღისა და ჭიანჭველების დაპირისპირება', episodeText: 'მებაღეს ხე დაენანა, ჩამორეკა დაუწყო, მაგრამ ჭიანჭველები არ უთმობდნენ.', visualType: 'ant_gardener', caption: 'მებაღე ხის გადარჩენას ცდილობს და რჩევას ეძებს.', durationMs: 4200 },\n            { id: 'ant-5', order: 5, title: 'ხის ღეროზე შექმნილი დაბრკოლება', episodeText: 'მებაღემ თამბაქოს წვენით ხის ღერო გარშემო დაასველა — ჭიანჭველები ხეზე დატყვევდნენ.', visualType: 'ant_ring', caption: 'ღეროზე გავლებული სალტე გზას კეტავს.', durationMs: 4500 },\n            { id: 'ant-6', order: 6, title: 'ჭიანჭველების თათბირი', episodeText: 'მათ ხის კენწეროზე მოიყარეს თავი და სჯა-ბაასი დაიწყეს.', visualType: 'ant_council', caption: 'გამოცდილი ჭიანჭველები გონივრულ გეგმას სთავაზობენ გუნდს.', durationMs: 4500 },\n            { id: 'ant-7', order: 7, title: 'ფოთლებით მიწაზე დაშვება', episodeText: 'გულადი ჭიანჭველები გაყვითლებულ ფოთლებზე დასხდნენ და მათთან ერთად მიწაზე ჩაცვივდნენ.', visualType: 'ant_leaves', caption: 'ყვითელი ფოთლები პარაშუტებივით ეშვებიან მიწაზე.', durationMs: 4800 },\n            { id: 'ant-8', order: 8, title: 'მიწის ნაწილაკების შეგროვება და პირველი ხიდის აშენება', episodeText: 'თამბაქოს სალტესთან მოზიდეს სველი მიწის ნამცეცები, მიაგლისეს და პატარა ხიდი გამართეს.', visualType: 'ant_mud_bridge', caption: 'მუყაითი მუშაობით სალტეზე მიწის ბილიკი იგება.', durationMs: 5000 },\n            { id: 'ant-9', order: 9, title: 'პირველი გამარჯვება და გაკვირვება', episodeText: 'ჭიანჭველები მშვიდობით ჩამოვიდნენ; მებაღე გაკვირვებით ადევნებდა თვალს მათ გონიერებას.', visualType: 'ant_cross1', caption: 'ერთობლივი შრომით დაბრკოლება დაძლეულია.', durationMs: 4200 },\n            { id: 'ant-10', order: 10, title: 'წყლით ს ორივე დაბრკოლებას (თამბაქოს სალტე და წყლის თხრილი) და მათი გადალახვის გზებს.',\n                'ხსნის, რატომ შეიცვალა მებაღის დამოკიდებულება.',\n                'მონაწილეობს ჯგუფურ პრობლემის გადაჭრის სავარჯიშოში.',\n            ],\n            comprehensionQuestions: [\n                { level: 'გახსენება', question: 'როგორ დახატა ავტორმა ჭიანჭველების ბუდე მოთხრობის დასაწყისში?' },\n                { level: 'ანალიზი', question: 'რა იყო პირველი დაბრკოლება და როგორ დაძლიეს ის ჭიანჭველებმა?' },\n                { level: 'ანალიზი', question: 'რით განსხვავდებოდა მეორე ხიდის აშენება პირველისგან?' },\n                { level: 'ღირებულებითი მსჯელობა', question: 'რატომ დათმო მებაღემ ბოლოს და ნება დართო ჭიანჭველებს?' },\n            ],\n            discussionPrompts: [\n                'როგორ შეიძლება კლასში კონფლიქტის მოგვარება „სჯა-ბაასით“?',\n                'რატომ არის მნიშვნელოვანი გუნდში სხვადასხვა როლის განაწილება (გულადები, მშენებლები, მრჩევლები)?',\n            ],\n            groupActivity: '„ინჟინერიის გამოწვევა“: ჯგუფებს ეძლევათ მუყაოს ფურცლები ან ფანქრები და უნდა ააგონ მინი-ხიდი თანამშრომლობით, ხოლო შემდეგ შეაფასონ, როგორ დაეხმარა თათბირი.',\n            individualTask: 'შეადგინე პრობლემის გადაჭრის სქემა ტექსტის მიხედვით: დაბრკოლება №1, დაბრკოლება №2, გამოსავალი და მორალი.',\n            worksheetTasks: [\n                '1. ჩამოთვალე მასალები, რომლებითაც ჭიანჭველები ბუდეს აშენებენ.',\n                '2. შეადარე ორი ხიდი: მიწის ხიდი vs ერთობის ცოცხალი ხიდი.',\n                '3. განმარტე სიტყვები: „სჯა-ბაასი“, „სალტე“, „მიაგლისეს“.',\n            ],\n            rubric: [\n                {\n                    criterion: 'პრობლემის გადაჭრის ანალიზი',\n                    emerging: 'ასახელებს ერთ დაბრკოლებას.',\n                    developing: 'აღწერს ორივე დაბრკოლებასა და გადაჭრის გზას.',\n                    exemplary: 'სისტემურად აანალიზებს თათბირის, სტრატეგიისა და თავდადების კავშირს.',\n                },\n                {\n                    criterion: 'თანამშრომლობითი აზროვნება',\n                    emerging: 'ესმის, რომ მეგობრები ეხმარებიან.',\n                    developing: 'ხსნის გუნდურობის უპირატესობას.',\n                    exemplary: 'ქმნის პრაქტიკულ მაგალითს საკლასო გუნდისთვის.',\n                },\n            ],\n            selfAssessmentStatements: [\n                'შემიძლია ტექსტში ვიპოვო პრობლემის გადაჭრის ეტაპები.',\n                'ვხვდები, რამ გააოცა მებაღე.',\n                'გუნდურ მუშაობაში ვუსმენ სხვების აზრს.',\n            ],\n        },\n    },\n    {\n        id: 'nino',\n        missionNumber: 5,\n        title: 'ქართველთა მოქცევა ქრისტიანობაზე და წმინდა ნინო, ჩვენი განმანათლებელი',\n        subtitle: 'სულიერი სინათლის, კულტურული მეხსიერებისა და ისტორიული გარდატეხის მატიანე',\n        recommendedGrade: 'VI კლასი (რეკომენდებული)',\n        gradeTag: 'VI',\n        locationName: 'ვაზის ჯვრის გზა',\n        valueTitle: 'რწმენა, სულიერება და ისტორიული მეხსიერება',\n        valueSymbolName: 'ვაზის ჯვარი',\n        accentColor: '#B8860B',\n        shortDescription: 'კაბადოკიელი ქალწულის, წმინდა ნინოს გზა მცხეთამდე, დედოფალ ნანას განკურნება, მეფე მირიანის სასწაული და ქართლის ნათლისღება.',\n        paragraphs: [\n            'სულიწმიდის მოფენის შემდეგ მოციქულებმა და ღვთისმშობელმა მარიამმა წილი ყარეს, ვინ რომელ ქვეყანაში უნდა წასულიყო სახარების საქადაგებლად. საქართველო წილად ხვდა თვითონ ღმრთისმშობელს. იგი მოემზადა ჩვენს ქვეყანაში წამოსასვლელად, მაგრამ ღამით მაცხოვარი გამოეცხადა და ურჩია: „შენ თვითონ იერუსალიმში დარჩი, რადგან მოხუცი ხარ, და შენს მაგივრად საქართველოში საქადაგებლად გაგზავნე ანდრია მოციქული, პირველწოდებულიო“. ასეც მოიქცა ყოვლადწმინდა ქალწული მარიამი.',\n            'მოციქული ანდრია პირველწოდებული მოვიდა შავი ზღვის პირად, უქადაგა სახარება გურულებს, იმერლებს, მეგრელებსა და აფხაზებს და მოაქცია ისინი ქრისტეს სჯულზედ. მაგრამ იმდენი აღარ დასცალდა, რომ ქართლ-კახეთშიაც გადმოსულიყო და იქაც გაევრცელებინა ქრისტიანობა. ქართლ-კახეთის მოქცევა ქრისტიანობაზე შემდეგში მოხდა წმინდა ნინოს მიერ, რომელსაც ამის გამო დაერქვა ქართველთა განმანათლებელი.',\n            'ვინ იყო ნინო და როგორ მოაქცია ქრისტეს სჯულზე ქართველები? წმინდა ნინო იყო კაბადოკიელი ქალი. კაბადოკია ჩვენი ქვეყნიდან სამხრეთით მდებარეობდა, სადაც ქართველთა მონათესავე ხალხიც ცხოვრობდა. ნინოს დედ-მამას მის მეტი შვილი არა ჰყავდა, ძლიერ უყვარდათ იგი და ცდილობდნენ კარგად გაეზარდათ, რადგანაც თვითონ დედა და მამა ნინოსი იყვნენ ღვთისმოყვარე ადამიანები, ამიტომ შვილიც საღმრთო წერილის კითხვასა და ლოცვაში აღზარდეს ხელსაქმის კეთებასა და გლახაკთა შეწყნარებაში.',\n            'ჯერ თორმეტი წლისა არ იქნებოდა ნინო, რომ დედ-მამა დაეხოცა და დაობლდა. მაშინ იგი თავისას წაიყვანა იერუსალიმის პატრიარქმა, ნინოს ბიძამ. ბიძამ სწავლის დასასრულებლად დისწული ერთ განათლებულსა და ფრიად ღვთისმოყვარე ქალს მიაბარა. ამ ახალი ოსტატისაგან ნინომ ყველაფერი მშვენივრად ისწავლა, რაც კი განათლებულმა ქრისტიანმა უნდა იცოდეს. ამასთან, იმდენად შეიყვარა ქრისტე ღმერთი, რომ გადაწყვიტა არ გათხოვილიყო და მთელი თავისი სიცოცხლე მისთვის შეეწირა.',\n            'როდესაც გაიგო, საქართველო, წილხვდომილი ღვთისმშობლისა, ჯერ კერპებს ემსახურება და ქრისტესი სრულიად არაფერი იცისო, მაშინვე გადაწყვიტა, წამოსულიყო ჩვენს ქვეყანაში და მოექცია იგი ქრისტიანობაზე. ბიძამ ძლიერ მოუწონა ამისთანა წმინდა წადილი, დალოცა, აკურთხა და გამოისტუმრა ჩვენსკენ.',\n            'გზაზე ბევრი დაბრკოლება ნახა მან, ბევრი ტანჯვა და წვალება გამოიარა, მაგრამ ყველას ადვილად იტანდა, რადგანაც ღმერთის იმედი ჰქონდა. ერთხელ, როდესაც ძლიერ შეწუხდა ნინო, სიზმარში გამოეცხადა ღვთისმშობელი ანგელოზებით, აღუთქვა თავისი შემწეობა, გაამხნევა და მისცა ხელში ჯვარი ვაზისა. ნინომ რომ გამოიღვიძა და ნახა, ხელში ჯვარი ეჭირა, სიხარულით აივსო და ღმერთს მხურვალე მადლობა შესწირა. ამისთანა მოწყალებით გამხნევებული ნინო ხელახლა გაბედულად დაადგა გზას და მცხეთას ჩამოვიდა.',\n            'მცხეთა მაშინ იყო ჩვენი ქვეყნის დედაქალაქი და იქ იჯდა მეფე საქართველოსი. იმჟამად მირიანი მეფობდა. ნინო დაბინავდა აქ და იწყო ქადაგება სახარებისა ჯერ ქალთა შორის. მან ორმოცამდე მოაქცია ქრისტეს სჯულზედ. ამ დროს დედოფალი ნანა მძიმედ დაავადდა და სიკვდილის პირზე იყო, ბევრი ექიმი მოღალეს, მაგრამ ვერა უშველეს რა. მაშინ ერთმა გაქრისტიანებულმა ქალმა ურჩია დედოფალს, მოეწვია ნინო და მორჩენა ეთხოვა მისთვის. დედოფალმა შეიწყნარა რჩევა, ნინო მოვიდა, ილოცა დედოფლისათვის და მაშინვე განკურნა, დედოფალმა უარყო კერპები და ირწმუნა ქრისტე.',\n            'გაიარა ცოტა ხანმა. ერთხელ მეფე მირიანი სანადიროდ წავიდა. ერთ მთაზე რომ იყო, მზე სრულიად დაუბნელდა და იღუპებოდა მეფე. მაშინ მან შემწეობა სთხოვა თავის კერპებს, მაგრამ ვერაფერი უშველეს. შემდეგ შეევედრა ქრისტეს და გამობრწყინდა მზე. მაშინ მეფე დარწმუნდა, რომ ქრისტე ჭეშმარიტი ღმერთია. ფიცხლად დაბრუნდა ნადირობიდან, თაყვანი სცა ნინოს და ყველას უამბო თავისი საოცარი თავგადასავალი.',\n            'მერე დაიბარა დიდებულები და უაზნონი და აცნობა განკურნება დედოფლისა, თავის გადარჩენა ქრისტეს შემწეობით და ურჩია, მათაც მიეღოთ ქრისტიანობა. ყველამ თანხმობა გამოაცხადა. მაშინ საბერძნეთიდან დაიბარეს ეპისკოპოსი, მღვდლები და მთელი ქართლი მოინათლა მტკვარსა და არაგვში.',\n            'როდესაც მთელი ქართლი ქრისტიანობაზე მოაქცია, ნინო გაემგზავრა, იქადაგა იქ სახარება და კახელებსაც მიაღებინა ქრისტიანობა. შემდეგ სამუდამო ბინად ბოდბისხევი ამოირჩია, სადაც დროს ატარებდა ღვთისმსახურებაში და დაუღალავად თესდა ხალხში ჭეშმარიტ სწავლას და წმინდა ზნეობას. ღრმად მოხუცებული მიიცვალა წმინდა ნინო და იქვე, ბოდბისხევში დაასაფლავეს, სადაც შემდეგ მონასტერი აშენდა.',\n            'ჯვარი ნინოსი ბოდბისხევიდან ჯერ მცხეთაში წაიღეს და ბოლოს ჩამოიტანეს თბილისში. იგი ახლაც ასვენია სიონის ტაძარში და ყველა ქართველი მას დიდ თაყვანსა სცემს. ნინო შეირაცხა წმინდანთა შორის და მოციქულთა თანასწორი ეწოდა. მეფე მირიანის შემდეგ ქრისტიანობა გააძლიერეს და ააყვავეს საქართველოს შემდგომმა მეფეებმა, მათ შორის ყველაზე დიდებულნი იყვნენ: ვახტანგ გორგასალი, დავით აღმაშენებელი, თამარ მეფე, გიორგი ბრწყინვალე და ერეკლე მეორე.',\n        ],\n        glossary: [\n            { word: 'წილხვდომილობა', meaning: 'საეკლესიო გადმოცემით, მოციქულთა წილისყრისას ქვეყნის წილად ხვედრა.', context: '„საქართველო წილად ხვდა თვითონ ღმრთისმშობელს.“' },\n            { word: '
